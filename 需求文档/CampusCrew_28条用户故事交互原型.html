CM64POB2q" id="acceptance"></p></aside></div><section data-page-node-id="mOGQXiCWktOsHdfMI8rrGY" class="flow"><h3 data-page-node-id="vmbfI1trSvVEy45g0u1F4J"><!--pnid:6BL5j1FNt6uCdgusq9TPMu-->交互路径与反馈</h3><div data-page-node-id="JXIMMhe0b0tL1x2V0bzxyQ" class="flowline" id="flow"></div><p data-page-node-id="q5EcbcEp3kmebMmRn6A5J4" class="mini"><!--pnid:De6Hn43vqQST7Ox1DRdlBq-->操作按钮会切换为成功状态；上方可检查加载、空列表、错误和业务冲突。最终字段、权限和状态规则以 SRS 为准。</p></section></main></div><script data-page-node-id="DA8it4Dr9KwU3XYY2IVNdp" data-pnid-children="39iE5vObnOldnOwtsIY2Yz">
const stories=[{"id": "US-01", "n": 1, "title": "注册与认证", "priority": "P0", "difficulty": "中", "screen": "AUTH-01", "role": "未认证学生", "story": "作为未认证学生，我希望使用校园邮箱、密码和邮件验证码完成注册，以便获得可信的校内身份。", "acceptance": "邮箱唯一，验证码正确且未过期才完成认证；并发注册同邮箱最多成功一次。验证码、密码和会话参数见 3.2“字段与参数约束”。", "value": "建立可信校内身份", "dependencies": "无", "test": "T-01", "iteration": 1, "owner": "何彦霖", "prototypeTitle": "校园邮箱注册", "fields": ["校园邮箱", "密码", "6 位验证码"], "actions": ["发送验证码", "完成注册"], "error": "验证码错误或过期"}, {"id": "US-02", "n": 2, "title": "登录与游客浏览", "priority": "P0", "difficulty": "低", "screen": "DISC-01", "role": "游客/学生", "story": "作为游客/学生，我希望不登录也能浏览公开招募，登录后使用需要校内身份的功能。", "acceptance": "游客可浏览、搜索公开招募；完整主页及业务操作需认证。支持登录与退出；退出和注销使原会话失效，封禁用户可登录只读。", "value": "降低浏览门槛并保护业务操作", "dependencies": "US-01", "test": "T-01", "iteration": 1, "owner": "何彦霖", "prototypeTitle": "登录与游客入口", "fields": ["邮箱", "密码"], "actions": ["游客浏览", "登录", "退出"], "error": "认证失败或账号封禁"}, {"id": "US-03", "n": 3, "title": "维护个人资料", "priority": "P1", "difficulty": "中", "screen": "ME-01", "role": "认证学生", "story": "作为认证学生，我希望填写昵称、简介和技能兴趣标签，以便向同学展示自己的能力和兴趣。", "acceptance": "昵称必填；头像、学院、年级、简介及标签选填；可选已有标签和新增标签；邮箱不公开。", "value": "便于展示匹配信息", "dependencies": "US-01", "test": "T-02", "iteration": 4, "owner": "刘默函", "prototypeTitle": "编辑个人资料", "fields": ["昵称", "学院", "年级", "简介", "技能标签"], "actions": ["保存资料", "预览主页"], "error": "昵称缺失"}, {"id": "US-04", "n": 4, "title": "资料隐私控制", "priority": "P1", "difficulty": "中", "screen": "ME-06", "role": "认证学生", "story": "作为认证学生，我希望控制自己能否被搜索，以及发布、申请和组队历史是否公开，以便保护隐私。", "acceptance": "默认可搜索、发布栏目公开，申请和队伍栏目隐藏；公开申请只显示招募及岗位，公开队伍不显示其他成员。关闭搜索不阻止通过合法业务链接查看公开主页。", "value": "控制个人信息披露", "dependencies": "US-03", "test": "T-02", "iteration": 4, "owner": "刘默函", "prototypeTitle": "隐私设置", "fields": ["搜索可见", "主页栏目可见", "邮箱不公开"], "actions": ["保存设置", "以游客预览"], "error": "字段不可见"}, {"id": "US-05", "n": 5, "title": "搜索同学", "priority": "P1", "difficulty": "中", "screen": "PEOPLE-01", "role": "认证学生", "story": "作为认证学生，我希望按昵称或技能标签找到同校伙伴并查看公开资料，以便主动联系合适的人。", "acceptance": "仅返回允许被搜索的认证用户；游客不能查看完整主页；只能访问公开字段。", "value": "找到合适合作者", "dependencies": "US-03/04", "test": "T-02", "iteration": 4, "owner": "刘默函", "prototypeTitle": "找同学", "fields": ["关键词", "学院筛选", "技能标签"], "actions": ["搜索", "查看主页"], "error": "没有符合条件的同学"}, {"id": "US-06", "n": 6, "title": "创建多岗位招募", "priority": "P0", "difficulty": "高", "screen": "POST-01", "role": "发布者", "story": "作为发布者，我希望一次发布含多个岗位的组队需求，以便清楚说明职责和人数。", "acceptance": "标题、分类、描述、未来截止时间及至少一个岗位必填；每岗名称和正整数名额必填；发布立即公开。字段限制见 3.2“字段与参数约束”。", "value": "明确岗位与名额", "dependencies": "US-01", "test": "T-03", "iteration": 2, "owner": "吴天成", "prototypeTitle": "创建招募", "fields": ["标题", "描述", "截止时间", "岗位名称", "岗位名额", "地点（选填）"], "actions": ["添加岗位", "保存草稿", "发布招募"], "error": "字段错误或截止时间无效"}, {"id": "US-07", "n": 7, "title": "保存与管理草稿", "priority": "P0", "difficulty": "中", "screen": "POST-02", "role": "发布者", "story": "作为发布者，我希望先保存不完整的招募草稿、之后编辑或删除，以便分阶段组织招募内容。", "acceptance": "允许不完整草稿手动保存；只有正式发布校验必填；可编辑删除草稿；无自动保存。", "value": "减少重复填写", "dependencies": "US-06", "test": "T-03", "iteration": 2, "owner": "吴天成", "prototypeTitle": "草稿箱", "fields": ["草稿标题", "上次编辑时间", "发布完整度"], "actions": ["继续编辑", "删除草稿", "发布"], "error": "草稿缺少必填字段"}, {"id": "US-08", "n": 8, "title": "管理已发布招募", "priority": "P1", "difficulty": "高", "screen": "ME-02", "role": "发布者", "story": "作为发布者，我希望编辑招募说明并在必要时提前结束，以便处理需求变化。", "acceptance": "仅可在招募开放且未受治理限制时编辑标题、描述、活动时间、地点和标签；岗位全部字段及截止时间冻结。有申请历史不能删除；主动结束按 BR-04 处理；结束后内容与结果锁定。", "value": "维护招募准确性", "dependencies": "US-06/07", "test": "T-03/T-08", "iteration": 3, "owner": "吴天成", "prototypeTitle": "我的招募", "fields": ["招募状态", "岗位名额", "申请数"], "actions": ["编辑招募", "主动结束", "查看申请"], "error": "已有申请的字段冻结"}, {"id": "US-09", "n": 9, "title": "浏览、搜索与排序", "priority": "P0", "difficulty": "中", "screen": "DISC-01", "role": "游客/学生", "story": "作为游客/学生，我希望按关键词、分类、标签、地点、截止时间筛选招募，以便快速找到合适的项目。", "acceptance": "支持关键词、分类、标签、地点、截止范围及可申请条件组合；不同条件取交集。关键词匹配标题、描述、标签任一字段。默认发布时间倒序，可切换截止时间升序；同值按 ID 稳定排序。", "value": "快速发现匹配项目", "dependencies": "无", "test": "T-04", "iteration": 2, "owner": "刘默函", "prototypeTitle": "发现组队", "fields": ["搜索词", "分类", "排序方式"], "actions": ["筛选", "打开招募"], "error": "没有符合条件的招募"}, {"id": "US-10", "n": 10, "title": "查看岗位详情", "priority": "P0", "difficulty": "低", "screen": "DISC-02", "role": "游客/学生", "story": "作为游客/学生，我希望阅读招募说明及各岗位名额和要求，以便判断自己是否适合。", "acceptance": "显示角色岗位、已录取/总名额、截止日期、发布者昵称头像；下架招募对普通用户不可公开访问。", "value": "判断岗位是否合适", "dependencies": "US-09", "test": "T-04", "iteration": 2, "owner": "刘默函", "prototypeTitle": "招募详情", "fields": ["项目介绍", "岗位列表", "剩余名额", "截止时间"], "actions": ["选择岗位", "申请"], "error": "岗位已满或招募已截止"}, {"id": "US-11", "n": 11, "title": "收藏招募", "priority": "P1", "difficulty": "低", "screen": "ME-05", "role": "认证学生", "story": "作为认证学生，我希望收藏感兴趣的招募并在个人中心找回，以便稍后决定是否申请。", "acceptance": "同一用户同一招募仅收藏一次；支持取消；已结束招募仍保留在收藏中并注明状态。", "value": "保存感兴趣招募", "dependencies": "US-01/10", "test": "T-04", "iteration": 4, "owner": "刘默函", "prototypeTitle": "收藏列表", "fields": ["已收藏招募", "当前状态"], "actions": ["收藏", "取消收藏", "打开详情"], "error": "已结束招募不可申请"}, {"id": "US-12", "n": 12, "title": "申请多个岗位", "priority": "P0", "difficulty": "高", "screen": "DISC-02", "role": "申请者", "story": "作为申请者，我希望对同一招募的不同岗位分别提交申请和选填留言，以便提高匹配机会。", "acceptance": "禁止自申请；已占本招募名额者不能新申请；同岗位最多一条待审。同招募可多岗待审。满员、截止、下架、封禁或被发布者拉黑时拒绝；服务端原子校验。", "value": "表达参与意愿", "dependencies": "US-01/10", "test": "T-05/T-16", "iteration": 3, "owner": "谭哲涵", "prototypeTitle": "岗位申请", "fields": ["岗位", "申请留言"], "actions": ["提交申请", "查看申请进度"], "error": "重复申请或同招募已有录取"}, {"id": "US-13", "n": 13, "title": "撤回与重新申请", "priority": "P1", "difficulty": "中", "screen": "ME-03", "role": "申请者", "story": "作为申请者，我希望撤回待审申请，被拒后能重新申请开放岗位，以便修正自己的选择。", "acceptance": "待审申请可撤回；拒绝或撤回后可以重申请；撤回不删除历史；结束、封禁、黑名单等条件仍有效。", "value": "纠正或调整申请", "dependencies": "US-12", "test": "T-05", "iteration": 3, "owner": "谭哲涵", "prototypeTitle": "我的申请", "fields": ["申请状态", "岗位", "历史原因"], "actions": ["撤回申请", "重新申请"], "error": "截止或名额满"}, {"id": "US-14", "n": 14, "title": "审批岗位申请", "priority": "P0", "difficulty": "高", "screen": "ME-02", "role": "发布者", "story": "作为发布者，我希望逐岗位查看申请人、选择通过或拒绝，以便选出适合的同学。", "acceptance": "仅发布者能审批自己的开放招募。通过时原子校验双方资格、截止、名额与同人同招募占位唯一性；拒绝需填写原因。成功后记录历史并通知，冲突不改变原状态。", "value": "完成成员选择", "dependencies": "US-12", "test": "T-05/T-06/T-16", "iteration": 3, "owner": "谭哲涵", "prototypeTitle": "申请审批", "fields": ["申请者", "留言", "岗位剩余名额"], "actions": ["通过", "拒绝"], "error": "并发录取冲突"}, {"id": "US-15", "n": 15, "title": "岗位满员自动处理", "priority": "P0", "difficulty": "高", "screen": "ME-02", "role": "发布者/申请者", "story": "作为发布者/申请者，我希望岗位满员后自动停止申请、结束待审竞争，以免产生超额录取和误解。", "acceptance": "岗位满额时其他待审申请自动未通过（原因：名额已满）；所有岗位满则整条招募立即结束；无七天确认期。", "value": "防止超额录取", "dependencies": "US-14", "test": "T-06/T-07", "iteration": 3, "owner": "吴天成", "prototypeTitle": "岗位容量", "fields": ["总名额", "已通过", "待审核"], "actions": ["查看申请", "刷新容量"], "error": "最后名额被他人占用"}, {"id": "US-16", "n": 16, "title": "撤销或放弃录取", "priority": "P1", "difficulty": "高", "screen": "ME-02", "role": "发布者/申请者", "story": "作为发布者/申请者，我希望在招募结束前更正录取结果或主动放弃，以便释放尚可使用的岗位名额。", "acceptance": "仅在整条招募开放且未受治理限制时允许撤销或放弃；准确释放一个名额并通知对方。所有岗位满员会立即结束，此后不能再调整。旧拒绝记录不会自动恢复。", "value": "处理录取变更", "dependencies": "US-14/15", "test": "T-07", "iteration": 3, "owner": "谭哲涵", "prototypeTitle": "录取变更", "fields": ["录取记录", "当前招募状态"], "actions": ["撤销录取", "放弃录取"], "error": "已结束招募不可调整"}, {"id": "US-17", "n": 17, "title": "追踪申请及组队历史", "priority": "P0", "difficulty": "中", "screen": "ME-03", "role": "认证学生", "story": "作为认证学生，我希望查看申请进度和通过记录，以便知道自己加入了哪些招募。", "acceptance": "本人可查看全部申请及原因历史；我的队伍仅展示当前为已通过的申请，撤销或放弃后移出该视图，但原通过事实保留在申请历史。", "value": "保持过程可追踪", "dependencies": "US-12/14", "test": "T-07", "iteration": 3, "owner": "谭哲涵", "prototypeTitle": "组队历史", "fields": ["我申请的", "我的队伍", "状态历史"], "actions": ["查看详情", "按状态筛选"], "error": "历史为空"}, {"id": "US-18", "n": 18, "title": "自由私信", "priority": "P1", "difficulty": "中", "screen": "MSG-01", "role": "认证学生", "story": "作为认证学生，我希望直接私信另一名认证学生，以便沟通招募细节或主动介绍项目。", "acceptance": "无须申请关系；发送双方须已认证且账号正常；受接收者对发送者的拉黑限制。只支持文字，不向发送者展示已读回执；会话入 ": "正常认证用户经密码及邮箱验证码核验、二次确认后注销；会话立即失效，原账号不能登录。资料、招募、申请和消息按第 4 章“注销数据处置”执行；封禁用户不可通过注销绕过治理。", "value": "退出平台并处置个人数据", "dependencies": "US-01", "test": "T-15", "iteration": 5, "owner": "吴天成", "prototypeTitle": "账号注销", "fields": ["身份验证", "数据处理说明", "二次确认"], "actions": ["验证身份", "确认注销"], "error": "验证码错误或仍有待处理记录"}, {"id": "US-28", "n": 28, "title": "主动邀请伙伴", "priority": "P2", "difficulty": "低", "screen": "PEOPLE-02", "role": "发布者", "story": "作为发布者，我希望将招募链接发给适合的同学，以便主动寻找成员。", "acceptance": "通过私信分享招募链接；无正式邀请态；对方仍需按一般申请流程接受审核。", "value": "低成本分享招募", "dependencies": "US-18", "test": "T-09", "iteration": 6, "owner": "刘默函", "prototypeTitle": "邀请伙伴", "fields": ["目标同学", "招募链接", "附言"], "actions": ["通过私信分享"], "error": "对方拉黑或链接已结束"}];let current=0,state='normal',mobile=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function list(){const q=$('search').value.trim().toLowerCase();$('storyList').innerHTML=stories.filter(s=>(s.id+s.title+s.prototypeTitle).toLowerCase().includes(q)).map(s=>`<button class="story ${stories[current].id===s.id?'active':''}" data-n="${s.n}"><b>${s.id}</b>${esc(s.title)} <span>${s.priority}</span></button>`).join('');document.querySelectorAll('.story').forEach(b=>b.onclick=()=>{current=Number(b.dataset.n)-1;state='normal';render()})}
function render(){const s=stories[current];list();$('storyTitle').textContent=`${s.id} ${s.title}`;$('meta').innerHTML=`<span class="badge">${s.screen}</span><span class="badge">${s.priority} · 难度${s.difficulty}</span>`;$('storyText').textContent=s.story;$('priority').textContent=s.priority+' / 难度'+s.difficulty;$('deps').textContent=s.dependencies;$('test').textContent=s.test;$('iter').textContent='第 '+s.iteration+' 轮 · '+s.owner;$('acceptance').textContent='验收：'+s.acceptance;$('device').classList.toggle('mobile',mobile);$('desktop').classList.toggle('on',!mobile);$('mobile').classList.toggle('on',mobile);document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('on',b.dataset.state===state));let body='';if(state==='loading')body='<div class="empty">正在加载，请稍候…</div>';else if(state==='empty')body='<div class="empty">当前没有符合条件的记录。可以调整筛选条件或返回上一步。</div>';else{let alert=state==='error'?`<div class="alert error">${esc(s.error)}。请检查输入或权限后重试。</div>`:state==='conflict'?'<div class="alert error">状态已变化，请刷新后重试；本次操作未重复生效。</div>':state==='success'?'<div class="alert good">操作已完成，最新状态已更新。</div>':'<div class="alert info">请核对信息后继续。页面按当前用户权限显示可操作项。</div>';let fields=s.fields.map((f,i)=>`<div class="field"><label for="f${i}">${esc(f)}</label><input id="f${i}" placeholder="请输入或选择${esc(f)}" ${state==='error'&&i===0?'aria-invalid="true"':''}></div>`).join('');let actions=s.actions.map((a,i)=>`<button class="${i===0?'primary':''}" data-action="${esc(a)}">${esc(a)}</button>`).join('');body=`<div class="hero"><h3>${esc(s.prototypeTitle)}</h3><p>${esc(s.value)} · ${esc(s.role)}</p></div>${alert}<div class="form">${fields}</div><div class="actions">${actions}</div>`}$('canvas').innerHTML=body;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{state='success';render()});$('flow').innerHTML=['进入'+s.prototypeTitle,'填写或查看字段',...s.actions.slice(0,1),'获得结果或错误反馈'].map(x=>`<span class="node">${esc(x)}</span>`).join('')}
$('search').addEventListener('input',list);$('desktop').onclick=()=>{mobile=false;render()};$('mobile').onclick=()=>{mobile=true;render()};document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});let hash=location.hash.match(/US-(\d{2})/i);if(hash){let n=Number(hash[1]);if(n>=1&&n<=28)current=n-1}render();
</script></body></html>
